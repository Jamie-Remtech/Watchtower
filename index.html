<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Watchtower — Tactical Coordination Hub</title>
    <script>
      // Apply the saved theme before anything paints (see src/theme/theme.js)
      try {
        var a = JSON.parse(localStorage.getItem('wt-theme') || 'null') || {};
        var th = a.theme || 'dark';
        if (th === 'system') th = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', th);
        var v = JSON.parse(localStorage.getItem('wt-theme-vars') || '{}');
        for (var k in v) document.documentElement.style.setProperty(k, v[k]);
      } catch (e) { /* defaults */ }
    </script>
    <script>
      // If the app bundle fails to load (stale service-worker race right
      // after an update), refresh the worker and reload once instead of
      // leaving a white screen.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT' && t.src && !sessionStorage.getItem('wt-recovered')) {
          sessionStorage.setItem('wt-recovered', '1');
          var done = function () { location.reload(); };
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
            navigator.serviceWorker.getRegistration()
              .then(function (r) { return r ? r.update() : null; })
              .then(done, done);
          } else { done(); }
        }
      }, true);
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
