  <path d="M 200 118 A 56 56 0 0 1 312 118" fill="none" stroke="#7dd3fc" stroke-width="18" stroke-linecap="round"/>
  <path d="M 162 118 A 94 94 0 0 1 350 118" fill="none" stroke="#7dd3fc" stroke-width="18" stroke-linecap="round" opacity="0.55"/>
